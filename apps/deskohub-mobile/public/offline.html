<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#00024f" />
    <title>Deskohub</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #00024f;
        color: #ffffff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        opacity: 0.85;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        border-radius: 999px;
        background: #ffffff;
        color: #00024f;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Jste offline</h1>
      <p>Deskohub potřebuje připojení k internetu. You're offline: Deskohub needs an internet connection.</p>
      <a href="/app/">Zkusit znovu · Try again</a>
    </main>
  </body>
</html>
