name: Temporary workspace Vercel drain access probe

on:
  push:
    branches:
      - t3code/e2e-console-email-logging
    paths:
      - .github/workflows/workspace-vercel-drain-access.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: workspace-checkout-e2e
    steps:
      - name: Check protected project and scoped drain access
        env:
          WORKSPACE_E2E_VERCEL_TOKEN: ${{ secrets.WORKSPACE_E2E_VERCEL_TOKEN }}
          WORKSPACE_E2E_VERCEL_PROJECT: ${{ vars.WORKSPACE_E2E_VERCEL_PROJECT }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.WORKSPACE_E2E_VERCEL_TOKEN;
          const projectId = process.env.WORKSPACE_E2E_VERCEL_PROJECT;
          const historyHost =
            "deskohub-workspace-site-kxt1snit0-filip-kalny-projects.vercel.app";
          const expectedSha = "44058705d869849a3a7789158aef93ee5a9a6880";
          const deadline = Date.now() + 105_000;
          const emit = (result) => process.stdout.write(`${JSON.stringify(result)}\n`);
          let metadataStatus = 0;
          let drainsStatus = null;
          let historyDeploymentStatus = null;
          let historyProjectMatches = false;
          let historyCommitMatches = false;
          let historyDeploymentIdValid = false;
          let historyOwnerIdValid = false;
          let historyStatus = null;

          const get = async (url) => {
            const remaining = deadline - Date.now();
            if (remaining <= 0) return { status: 0, response: null };
            try {
              const response = await fetch(url, {
                method: "GET",
                headers: {
                  Accept: "application/json",
                  Authorization: `Bearer ${token}`,
                },
                redirect: "error",
                signal: AbortSignal.timeout(Math.min(20_000, remaining)),
              });
              return { status: response.status, response };
            } catch {
              return { status: 0, response: null };
            }
          };

          const discardBody = async (response) => {
            if (!response?.body) return;
            try {
              await response.body.cancel();
            } catch {
              // The status is sufficient; response bodies are intentionally discarded.
            }
          };

          try {
            if (token && /^[A-Za-z0-9_-]+$/.test(projectId ?? "")) {
              const projectResult = await get(
                `https://api.vercel.com/v9/projects/${encodeURIComponent(projectId)}`
              );
              metadataStatus = projectResult.status;
              let projectMetadata = null;
              if (projectResult.status === 200) {
                projectMetadata = await projectResult.response.json().catch(() => null);
              } else {
                await discardBody(projectResult.response);
              }

              const ownerId = projectMetadata?.accountId;
              if (
                projectMetadata?.id === projectId &&
                typeof ownerId === "string" &&
                /^[A-Za-z0-9_-]+$/.test(ownerId)
              ) {
                const query = new URLSearchParams({
                  teamId: ownerId,
                  projectId,
                  includeMetadata: "false",
                });
                const drainsResult = await get(
                  `https://api.vercel.com/v1/drains?${query}`
                );
                drainsStatus = drainsResult.status;
                await discardBody(drainsResult.response);
              }

              const deploymentResult = await get(
                `https://api.vercel.com/v13/deployments/${encodeURIComponent(historyHost)}`
              );
              historyDeploymentStatus = deploymentResult.status;
              if (deploymentResult.status === 200) {
                const deployment = await deploymentResult.response.json().catch(() => null);
                historyProjectMatches = deployment?.projectId === projectId;
                historyCommitMatches =
                  deployment?.gitSource?.sha === expectedSha ||
                  deployment?.meta?.githubCommitSha === expectedSha;
                historyDeploymentIdValid =
                  typeof deployment?.id === "string" &&
                  /^[A-Za-z0-9_-]+$/.test(deployment.id);
                historyOwnerIdValid =
                  typeof deployment?.ownerId === "string" &&
                  /^[A-Za-z0-9_-]+$/.test(deployment.ownerId);

                if (
                  historyProjectMatches &&
                  historyCommitMatches &&
                  historyDeploymentIdValid &&
                  historyOwnerIdValid
                ) {
                  const historyQuery = new URLSearchParams({
                    projectId,
                    ownerId: deployment.ownerId,
                    deploymentId: deployment.id,
                    page: "1",
                    startDate: String(Date.parse("2026-10-02T09:50:00Z")),
                    endDate: String(Date.parse("2026-10-02T09:57:00Z")),
                    search: "account.magic-link.preview-e2e",
                  });
                  const historyResult = await get(
                    `https://vercel.com/api/logs/request-logs?${historyQuery}`
                  );
                  historyStatus = historyResult.status;
                  await discardBody(historyResult.response);
                }
              } else {
                await discardBody(deploymentResult.response);
              }
            }
          } catch {
            // Keep the probe output limited to credential presence and HTTP statuses.
          }

          emit({
            token_present: Boolean(token),
            metadata_status: metadataStatus,
            scoped_drains_list_status: drainsStatus,
            history_deployment_metadata_status: historyDeploymentStatus,
            history_project_matches: historyProjectMatches,
            history_commit_matches: historyCommitMatches,
            history_deployment_id_valid: historyDeploymentIdValid,
            history_owner_id_valid: historyOwnerIdValid,
            history_status: historyStatus,
          });
          NODE
