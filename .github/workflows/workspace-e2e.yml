name: Workspace E2E

on:
  repository_dispatch:
    types: [vercel.deployment.skipped, vercel.deployment.success]
  workflow_dispatch:
    inputs:
      cleanup_stale_e2e_reservations:
        description: Cancel strictly identified stale E2E reservations before validation
        required: false
        default: false
        type: boolean
      recover_failed_e2e_run:
        description: Run cleanup only for the reviewed failed Workspace E2E source run
        required: false
        default: false
        type: boolean
      sha:
        description: Exact commit SHA to test
        required: true
      url:
        description: Immutable Vercel preview URL
        required: true
      ref:
        description: Internal PR branch name
        required: true

permissions:
  contents: read
  deployments: read
  pull-requests: read
  statuses: write

concurrency:
  group: workspace-e2e-${{ github.event_name == 'workflow_dispatch' && 'prj_7FliQBcbBiBwGaO2JLrigicnXCRd' || github.event.client_payload.project.id }}-pr-${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.client_payload.git.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.recover_failed_e2e_run == true && '-recovery' || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'workflow_dispatch' && inputs.recover_failed_e2e_run == true) && (github.event_name != 'repository_dispatch' || github.event.client_payload.state.type != 'skipped') }}

jobs:
  resolve-target:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.client_payload.project.id == 'prj_7FliQBcbBiBwGaO2JLrigicnXCRd' &&
       github.event.client_payload.environment == 'preview')
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.target.outputs.eligible }}
      head_ref: ${{ steps.target.outputs.head_ref }}
      pr_number: ${{ steps.target.outputs.pr_number }}
      sha: ${{ steps.target.outputs.sha }}
      skipped: ${{ steps.target.outputs.skipped }}
      skipped_status_description: ${{ steps.target.outputs.skipped_status_description }}
      skipped_status_state: ${{ steps.target.outputs.skipped_status_state }}
      url: ${{ steps.target.outputs.url }}
    steps:
      - name: Resolve eligible PR and immutable preview
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.event.client_payload.git.ref }}
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.client_payload.git.sha }}
          TARGET_SKIPPED: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.state.type == 'skipped' }}
          TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.url || github.event.client_payload.url }}
        run: |
          set -euo pipefail

          if [[ ! "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Target SHA is not a full Git commit SHA" >&2
            exit 1
          fi
          if ! git check-ref-format --branch "$TARGET_REF" >/dev/null; then
            echo "Target ref is not a valid branch name" >&2
            exit 1
          fi

          normalized_url="$({ TARGET_URL="$TARGET_URL" node <<'NODE'
          const url = new URL(process.env.TARGET_URL);
          const host = url.hostname.toLowerCase();
          if (
            url.protocol !== "https:" ||
            url.username ||
            url.password ||
            url.port ||
            url.pathname !== "/" ||
            url.search ||
            url.hash ||
            !/^[a-z0-9-]+\.vercel\.app$/.test(host) ||
            host.includes("-git-")
          ) {
            throw new Error("Target must be an immutable HTTPS Vercel deployment origin");
          }
          process.stdout.write(`https://${host}`);
          NODE
          } 2>/dev/null)" || {
            echo "Target must be an immutable HTTPS Vercel deployment origin" >&2
            exit 1
          }

          deployments="$(gh api \
            --method GET \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/deployments" \
            -f sha="$TARGET_SHA" \
            -f environment='Preview – deskohub-workspace-site' \
            -f per_page=100)"
          deployment_matches_target=false
          while IFS= read -r deployment_id; do
            if [[ -z "$deployment_id" ]]; then
              continue
            fi
            deployment_statuses="$(gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses")"
            if jq -e \
              --arg target "$normalized_url" \
              --argjson skipped "$TARGET_SKIPPED" \
              'any(.[];
                (if $skipped then
                  .state == "inactive" and
                  .description == "Skipped - Not affected"
                else
                  .state == "success"
                end) and
                (((.environment_url? // "") | rtrimstr("/")) == $target)
              )' \
              <<<"$deployment_statuses" >/dev/null; then
              deployment_matches_target=true
              break
            fi
          done < <(jq -r '.[] | select(.creator.login == "vercel[bot]") | .id' <<<"$deployments")
          if [[ "$deployment_matches_target" != "true" ]]; then
            if [[ "$TARGET_SKIPPED" == "true" ]]; then
              echo "No skipped exact-SHA Workspace deployment matches the target URL" >&2
            else
              echo "No successful exact-SHA Workspace deployment matches the target URL" >&2
            fi
            exit 1
          fi

          pulls="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/commits/$TARGET_SHA/pulls")"
          eligible_pulls="$(jq \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg ref "$TARGET_REF" \
            --arg sha "$TARGET_SHA" \
            '[.[] | select(
              .state == "open" and
              .draft == false and
              .head.repo.full_name == $repo and
              .head.ref == $ref and
              .head.sha == $sha and
              .user.login != "dependabot[bot]" and
              (.head.ref | startswith("dependabot/") | not)
            )]' <<<"$pulls")"
          eligible_count="$(jq 'length' <<<"$eligible_pulls")"

          if [[ "$eligible_count" == "0" ]]; then
            echo "No eligible open internal PR matches the exact deployment SHA"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$eligible_count" != "1" ]]; then
            echo "More than one eligible PR matches the exact deployment SHA" >&2
            exit 1
          fi

          pr_number="$(jq -r '.[0].number' <<<"$eligible_pulls")"

          if [[ "$TARGET_SKIPPED" == "true" ]]; then
            previous_state=""
            mapfile -t commit_shas < <(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number/commits?per_page=100" \
              --jq '.[].sha')
            target_seen=false
            for ((index=${#commit_shas[@]} - 1; index >= 0; index--)); do
              commit_sha="${commit_shas[$index]}"
              if [[ "$commit_sha" == "$TARGET_SHA" ]]; then
                target_seen=true
                continue
              fi
              if [[ "$target_seen" != "true" ]]; then
                continue
              fi
              previous_state="$(gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/commits/$commit_sha/statuses?per_page=100" | \
                jq -r 'add | first(.[] | select(
                  .context == "Workspace E2E" and
                  .creator.login == "github-actions[bot]"
                )) | .state // empty')"
              if [[ -n "$previous_state" ]]; then
                break
              fi
            done
            if [[ "$target_seen" != "true" ]]; then
              echo "Target SHA is missing from the matching PR history" >&2
              exit 1
            fi

            skipped_status_state=success
            skipped_status_description='Workspace unchanged; E2E skipped'
            if [[ -n "$previous_state" && "$previous_state" != "success" ]]; then
              skipped_status_state=failure
              skipped_status_description='Workspace unchanged; prior E2E did not pass'
            fi
            {
              echo "skipped_status_state=$skipped_status_state"
              echo "skipped_status_description=$skipped_status_description"
            } >> "$GITHUB_OUTPUT"
          fi

          {
            echo "eligible=true"
            echo "head_ref=$TARGET_REF"
            echo "pr_number=$pr_number"
            echo "sha=$TARGET_SHA"
            echo "skipped=$TARGET_SKIPPED"
            echo "url=$normalized_url"
          } >> "$GITHUB_OUTPUT"

  test-e2e:
    needs: resolve-target
    if: inputs.recover_failed_e2e_run != true && needs.resolve-target.outputs.eligible == 'true' && needs.resolve-target.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: workspace-checkout-e2e
    permissions:
      actions: read
      contents: read
      statuses: write
    outputs:
      release_outcome: ${{ steps.release.outcome }}
      shard: ${{ steps.lease.outputs.shard }}
    env:
      NEXI_API_ORIGIN: https://xpaysandbox.nexigroup.com/api/phoenix-0.0/psp
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
      TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WORKSPACE_E2E_BASE_URL: ${{ needs.resolve-target.outputs.url }}
      WORKSPACE_E2E_EXECUTION_CONTEXT: ${{ github.event_name == 'workflow_dispatch' && 'manual' || 'ci' }}
      WORKSPACE_E2E_PR_NUMBER: ${{ needs.resolve-target.outputs.pr_number }}

    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Confirm checked-out commit
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TARGET_SHA" ]]; then
            echo "Checked-out commit does not match the deployment SHA" >&2
            exit 1
          fi
          echo "Checked out exact deployment SHA $actual_sha"

      - name: Checkout allocation action
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .workspace-e2e-coordinator
          persist-credentials: false
          sparse-checkout: .github/actions/workspace-e2e-allocation

      - name: Select preferred date shard
        id: preferred-shard
        env:
          PR_NUMBER: ${{ needs.resolve-target.outputs.pr_number }}
        run: echo "shard=$((PR_NUMBER % 3 + 1))" >> "$GITHUB_OUTPUT"

      - name: Lease an available date shard
        id: lease
        uses: ./.workspace-e2e-coordinator/.github/actions/workspace-e2e-allocation
        with:
          mode: acquire
          preferred-shard: ${{ steps.preferred-shard.outputs.shard }}
          token: ${{ github.token }}
          database-url: ${{ secrets.WORKSPACE_E2E_COORDINATOR_DATABASE_URL }}

      - name: Publish allocation status
        env:
          ALLOCATION_SHARD: ${{ steps.lease.outputs.shard }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
        run: |
          lease_target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending \
            -f context='Workspace E2E allocation' \
            -f description="Shard $ALLOCATION_SHARD of 3 allocated" \
            -f target_url="$lease_target_url" \
            >/dev/null

      - name: Publish pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state=pending \
            -f context='Workspace E2E' \
            -f description='Protected preview E2E is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Neon branch backing the preview
        id: preview-database
        env:
          HEAD_REF: ${{ needs.resolve-target.outputs.head_ref }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          if ! git check-ref-format --branch "$HEAD_REF" >/dev/null; then
            echo "Unsupported preview branch name" >&2
            exit 1
          fi
          branch_name="preview/$HEAD_REF"
          if ! git check-ref-format --branch "$branch_name" >/dev/null; then
            echo "Derived Neon preview branch name is invalid" >&2
            exit 1
          fi

          branch_id=""
          for _ in $(seq 1 12); do
            branches="$(bunx neonctl@2.30.1 branches list \
              --project-id "$NEON_PROJECT_ID" \
              --api-key "$NEON_API_KEY" \
              --output json)"
            matches="$(jq \
              --arg name "$branch_name" \
              '[(if type == "array" then . else .branches end)[] | select(.name == $name and .primary != true)]' \
              <<<"$branches")"
            match_count="$(jq 'length' <<<"$matches")"
            if [[ "$match_count" == "1" ]]; then
              branch_id="$(jq -r '.[0].id' <<<"$matches")"
              break
            fi
            if [[ "$match_count" != "0" ]]; then
              echo "Neon preview branch mapping is ambiguous" >&2
              exit 1
            fi
            sleep 5
          done

          if [[ ! "$branch_id" =~ ^br-[A-Za-z0-9-]+$ ]]; then
            echo "The integration-created Neon preview branch was not found" >&2
            exit 1
          fi
          echo "Matched immutable preview to Neon branch $branch_name ($branch_id)"

          direct_url="$(bunx neonctl@2.30.1 connection-string "$branch_id" \
            --project-id "$NEON_PROJECT_ID" \
            --role-name neondb_owner \
            --database-name neondb \
            --api-key "$NEON_API_KEY")"
          echo "::add-mask::$direct_url"
          pooled_url="$(bunx neonctl@2.30.1 connection-string "$branch_id" \
            --project-id "$NEON_PROJECT_ID" \
            --role-name neondb_owner \
            --database-name neondb \
            --pooled \
            --api-key "$NEON_API_KEY")"
          echo "::add-mask::$pooled_url"

          {
            echo "branch_id=$branch_id"
            echo "branch_name=$branch_name"
            echo "direct_url=$direct_url"
            echo "pooled_url=$pooled_url"
          } >> "$GITHUB_OUTPUT"

      - name: Migrate preview database
        working-directory: apps/deskohub-workspace
        env:
          DATABASE_URL: ${{ steps.preview-database.outputs.direct_url }}
          DATABASE_URL_UNPOOLED: ${{ steps.preview-database.outputs.direct_url }}
        run: bun run db:migrate

      - name: Reconcile stale Workspace E2E reservations
        if: github.event_name == 'workflow_dispatch' && inputs.cleanup_stale_e2e_reservations
        env:
          DATABASE_URL: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_DATABASE_URL_UNPOOLED: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_DATABASE_ALLOWLIST: ${{ steps.preview-database.outputs.direct_url }}
          DOTYPOS_API_URL: ${{ secrets.WORKSPACE_E2E_DOTYPOS_API_URL }}
          DOTYPOS_CLIENT_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_ID }}
          DOTYPOS_CLIENT_SECRET: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_SECRET }}
          DOTYPOS_REFRESH_TOKEN: ${{ secrets.WORKSPACE_E2E_DOTYPOS_REFRESH_TOKEN }}
          DOTYPOS_CLOUD_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLOUD_ID }}
          DOTYPOS_BRANCH_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_BRANCH_ID }}
          DOTYPOS_EMPLOYEE_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_EMPLOYEE_ID }}
        run: bun --cwd apps/deskohub-workspace e2e:cleanup-stale --apply

      - name: Validate aggregate Dotypos capacity
        env:
          DATABASE_URL: ${{ steps.preview-database.outputs.pooled_url }}
          WORKSPACE_E2E_DATABASE_URL_UNPOOLED: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_DATABASE_ALLOWLIST: ${{ steps.preview-database.outputs.direct_url }}
          DOTYPOS_API_URL: ${{ secrets.WORKSPACE_E2E_DOTYPOS_API_URL }}
          DOTYPOS_CLIENT_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_ID }}
          DOTYPOS_CLIENT_SECRET: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_SECRET }}
          DOTYPOS_REFRESH_TOKEN: ${{ secrets.WORKSPACE_E2E_DOTYPOS_REFRESH_TOKEN }}
          DOTYPOS_CLOUD_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLOUD_ID }}
          DOTYPOS_BRANCH_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_BRANCH_ID }}
          DOTYPOS_EMPLOYEE_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_EMPLOYEE_ID }}
        run: bun --cwd apps/deskohub-workspace e2e:capacity

      - name: Verify hosted browser runtime
        run: |
          set -euo pipefail
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$browser_path" || ! -x "$browser_path" ]]; then
            echo "The hosted runner does not provide a supported browser" >&2
            exit 1
          fi
          "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Run checkout E2E
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          WORKSPACE_E2E_ADMIN_BASIC_AUTH: ${{ secrets.WORKSPACE_E2E_ADMIN_BASIC_AUTH }}
          DATABASE_URL: ${{ steps.preview-database.outputs.pooled_url }}
          WORKSPACE_E2E_DATABASE_URL_UNPOOLED: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_DATABASE_ALLOWLIST: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_PROVIDER_PERMIT_REQUIRED: "true"
          WORKSPACE_E2E_PROVIDER_PERMIT_DATABASE_URL: ${{ secrets.WORKSPACE_E2E_PROVIDER_PERMIT_DATABASE_URL }}
          WORKSPACE_E2E_VERCEL_TOKEN: ${{ secrets.WORKSPACE_E2E_VERCEL_TOKEN }}
          WORKSPACE_E2E_VERCEL_PROJECT: ${{ vars.WORKSPACE_E2E_VERCEL_PROJECT }}
          DOTYPOS_API_URL: ${{ secrets.WORKSPACE_E2E_DOTYPOS_API_URL }}
          DOTYPOS_CLIENT_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_ID }}
          DOTYPOS_CLIENT_SECRET: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_SECRET }}
          DOTYPOS_REFRESH_TOKEN: ${{ secrets.WORKSPACE_E2E_DOTYPOS_REFRESH_TOKEN }}
          DOTYPOS_CLOUD_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLOUD_ID }}
          DOTYPOS_BRANCH_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_BRANCH_ID }}
          DOTYPOS_EMPLOYEE_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_EMPLOYEE_ID }}
          WORKSPACE_E2E_POSTHOG_HOST: ${{ vars.WORKSPACE_E2E_POSTHOG_HOST }}
          WORKSPACE_E2E_POSTHOG_PROJECT_TOKEN: ${{ vars.WORKSPACE_E2E_POSTHOG_PROJECT_TOKEN }}
          WORKSPACE_E2E_ALLOCATION_SHARD: ${{ steps.lease.outputs.shard }}
        run: bun turbo test:e2e --filter=deskohub-workspace

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: workspace-e2e-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/deskohub-workspace/e2e-artifacts/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reservation-link screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-e2e-reservation-link-screenshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/deskohub-workspace/e2e-artifacts/reservation-links/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload synthetic PR review screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-account-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/deskohub-workspace/e2e-artifacts/account-review/*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Classify synthetic main account state
        if: failure()
        continue-on-error: true
        env:
          DATABASE_URL: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_DATABASE_URL_UNPOOLED: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_DATABASE_ALLOWLIST: ${{ steps.preview-database.outputs.direct_url }}
          DOTYPOS_API_URL: ${{ secrets.WORKSPACE_E2E_DOTYPOS_API_URL }}
          DOTYPOS_CLIENT_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_ID }}
          DOTYPOS_CLIENT_SECRET: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_SECRET }}
          DOTYPOS_REFRESH_TOKEN: ${{ secrets.WORKSPACE_E2E_DOTYPOS_REFRESH_TOKEN }}
          DOTYPOS_CLOUD_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLOUD_ID }}
          DOTYPOS_BRANCH_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_BRANCH_ID }}
          DOTYPOS_EMPLOYEE_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_EMPLOYEE_ID }}
        run: bun --cwd apps/deskohub-workspace e2e:account-state
      - name: Release date shard
        id: release
        if: always() && steps.lease.outputs.shard != ''
        uses: ./.workspace-e2e-coordinator/.github/actions/workspace-e2e-allocation
        with:
          mode: release
          token: ${{ github.token }}
          database-url: ${{ secrets.WORKSPACE_E2E_COORDINATOR_DATABASE_URL }}

  recover-failed-e2e:
    needs: resolve-target
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.recover_failed_e2e_run == true &&
      needs.resolve-target.outputs.eligible == 'true' &&
      needs.resolve-target.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: workspace-checkout-e2e
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_SOURCE_RUN_ID: "37493312976"
      EXPECTED_SOURCE_RUN_ATTEMPT: "1"
      EXPECTED_TARGET_SHA: c61b02f79a7bd1ebbd9c5ec5f863034d91b0271f
      EXPECTED_TARGET_REF: t3code/reorder-cowork-packages
      EXPECTED_TARGET_URL: https://deskohub-workspace-site-c7ovd3s03-filip-kalny-projects.vercel.app
      EXPECTED_NEON_BRANCH_ID_SHA256: c4c75eb338e2522aa98c7312513391d5053c7246f1400ca45684374499a9a987
      RECOVERY_CODE_REF: t3code/pr464-e2e-recovery-37493312976
      RECOVERY_CODE_SHA: ${{ github.sha }}
      RUNTIME_TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
      RUNTIME_TARGET_REF: ${{ needs.resolve-target.outputs.head_ref }}
      RUNTIME_TARGET_URL: ${{ needs.resolve-target.outputs.url }}
      RUNTIME_PR_NUMBER: ${{ needs.resolve-target.outputs.pr_number }}
      NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
    steps:
      - name: Checkout the reviewed recovery code ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm recovery code and exact restored runtime target
        run: |
          set -euo pipefail
          actual_code_sha="$(git rev-parse HEAD)"
          if [[ "$actual_code_sha" != "$RECOVERY_CODE_SHA" || "$actual_code_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out recovery code does not match this reviewed workflow run" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/$RECOVERY_CODE_REF" ]]; then
            echo "Cleanup recovery must run from its reviewed temporary code ref" >&2
            exit 1
          fi
          if [[ "$RUNTIME_TARGET_SHA" != "$EXPECTED_TARGET_SHA" ||
                "$RUNTIME_TARGET_REF" != "$EXPECTED_TARGET_REF" ||
                "$RUNTIME_TARGET_URL" != "$EXPECTED_TARGET_URL" ||
                "$RUNTIME_PR_NUMBER" != "464" ]]; then
            echo "Resolved runtime target is not the original failed PR preview" >&2
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install repository dependencies
        run: bun install --frozen-lockfile

      - name: Generate cleanup-only Playwright prerequisites
        run: |
          set -euo pipefail
          bun turbo run i18n:compile --filter=deskohub-workspace
          bun turbo run generate --filter=@deskohub/igloohome

      - name: Verify hosted browser runtime
        run: |
          set -euo pipefail
          browser_path="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$browser_path" || ! -x "$browser_path" ]]; then
            echo "The hosted runner does not provide a supported browser runtime" >&2
            exit 1
          fi
          "$browser_path" --version
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"

      - name: Validate and download the exact failed source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ env.EXPECTED_SOURCE_RUN_ID }}
          SOURCE_RUN_ATTEMPT: ${{ env.EXPECTED_SOURCE_RUN_ATTEMPT }}
        run: |
          set -euo pipefail
          source_run="$(gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          if ! jq -e \
            --argjson source_run_id "$SOURCE_RUN_ID" \
            --argjson source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            '.id == $source_run_id and
             .run_attempt == $source_run_attempt and
             .name == "Workspace E2E" and
             .path == ".github/workflows/workspace-e2e.yml" and
             .event == "repository_dispatch" and
             .status == "completed" and
             .conclusion == "failure"' \
            <<<"$source_run" >/dev/null; then
            echo "The exact source run is not the expected completed failed Workspace E2E run" >&2
            exit 1
          fi

          expected_artifact="workspace-e2e-artifacts-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          source_artifacts="$(gh api -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100")"
          artifact_count="$(jq --arg expected "$expected_artifact" \
            '[.artifacts[] | select(.name == $expected and .expired == false and .size_in_bytes > 0)] | length' \
            <<<"$source_artifacts")"
          if [[ "$artifact_count" != "1" ]]; then
            echo "The exact source-run cleanup artifact is missing or ambiguous" >&2
            exit 1
          fi

          source_dir="$RUNNER_TEMP/workspace-e2e-source-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          if [[ -e "$source_dir" ]]; then
            echo "The source artifact staging path already exists" >&2
            exit 1
          fi
          mkdir -p "$source_dir"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$expected_artifact" \
            --dir "$source_dir"

          context_paths=()
          while IFS= read -r path; do context_paths+=("$path"); done < <(
            find "$source_dir" -type f -path '*/checkout/run-context.json' -print
          )
          if [[ "${#context_paths[@]}" != "1" ]]; then
            echo "The source artifact does not contain one unambiguous run context" >&2
            exit 1
          fi
          source_checkout="${context_paths[0]%/run-context.json}"
          case "${source_checkout#"$source_dir"/}" in
            checkout|apps/deskohub-workspace/e2e-artifacts/checkout) ;;
            *)
              echo "The source run context is outside the expected checkout artifact root" >&2
              exit 1
              ;;
          esac
          for required_file in run-context.json run-plan.json; do
            if [[ ! -f "$source_checkout/$required_file" ]]; then
              echo "The source artifact is missing a required cleanup identity file" >&2
              exit 1
            fi
          done
          if find "$source_checkout" -type l -print -quit | grep -q .; then
            echo "The source cleanup artifact contains an unexpected symbolic link" >&2
            exit 1
          fi

          context_file="$source_checkout/run-context.json"
          plan_file="$source_checkout/run-plan.json"
          case_dir="$source_checkout/cleanup-journals"
          account_file="$case_dir/account-lane.json"
          if [[ ! -f "$account_file" ]]; then
            echo "The source account cleanup journal is missing" >&2
            exit 1
          fi
          if ! jq -e \
            --arg source_run_id "$SOURCE_RUN_ID" \
            --arg source_run_attempt "$SOURCE_RUN_ATTEMPT" \
            --arg target_sha "$EXPECTED_TARGET_SHA" \
            '.runId == ($source_run_id + "-" + $source_run_attempt) and
             .githubRunId == $source_run_id and
             .githubRunAttempt == ($source_run_attempt | tonumber) and
             .targetSha == $target_sha and
             .prNumber == 464 and
             .executionContext == "ci" and
             (.allocation | type == "object" and
              .shardCount == 3 and
              (.shardIndex | type == "number" and . >= 0 and . < 3) and
              .fromOffsetDays == 14 and .toOffsetDays == 90)' \
            "$context_file" >/dev/null; then
            echo "The source run context does not match the original runtime identity" >&2
            exit 1
          fi
          if ! jq -e --slurpfile context "$context_file" \
            '.version == 2 and
             (.preparation | type == "object") and
             .runContext == $context[0]' \
            "$plan_file" >/dev/null; then
            echo "The source run plan does not match its original run context" >&2
            exit 1
          fi
          if ! jq -e \
            '.version == 1 and
             .laneId == "account-lane" and
             (.startedAt | type == "string") and
             (.completed | type == "boolean") and
             (.authUserIds | type == "array" and all(.[]; type == "string")) and
             (.dotyposCustomerIds | type == "array" and all(.[]; type == "string")) and
             (.dotyposReservationIds | type == "array" and all(.[]; type == "string"))' \
            "$account_file" >/dev/null; then
            echo "The source account cleanup journal is invalid" >&2
            exit 1
          fi

          if [[ ! -d "$case_dir" ]]; then
            echo "The source checkout cleanup journal directory is missing" >&2
            exit 1
          fi
          if find "$case_dir" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "The source checkout cleanup journals contain an unexpected entry" >&2
            exit 1
          fi
          case_ids="$(bun -e 'import { workspaceE2ECaseIds } from "./apps/deskohub-workspace/e2e/playwright-checkout/case-catalog.ts"; process.stdout.write(workspaceE2ECaseIds.join("\n"))')"
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            filename="${path##*/}"
            if [[ "$filename" == "account-lane.json" ]]; then
              continue
            fi
            case_id="${filename%.json}"
            if [[ "$filename" != "$case_id.json" ]] || ! grep -Fxq "$case_id" <<<"$case_ids"; then
              echo "The source artifact contains an unknown checkout cleanup journal" >&2
              exit 1
            fi
            if ! jq -e --arg case_id "$case_id" \
              '.version == 2 and
               .caseId == $case_id and
               (.startedAt | type == "string") and
               (.checkoutStates | type == "array" and all(.[];
                 type == "object" and
                 (.data | type == "object") and
                 ((has("orderId") | not) or (.orderId | type == "string")) and
                 ((has("completedDotyposReservationId") | not) or (.completedDotyposReservationId | type == "string")) and
                 ((has("startedAt") | not) or (.startedAt | type == "string"))
               ))' "$path" >/dev/null; then
              echo "A source checkout cleanup journal is invalid" >&2
              exit 1
            fi
          done < <(find "$case_dir" -mindepth 1 -maxdepth 1 -type f -print)
          if find "$case_dir" -mindepth 1 -maxdepth 1 -type l -print -quit | grep -q .; then
            echo "The source checkout cleanup journals contain an unexpected symbolic link" >&2
            exit 1
          fi

          recovery_root="$RUNNER_TEMP/workspace-e2e-recovery-validated-$SOURCE_RUN_ID-$SOURCE_RUN_ATTEMPT"
          restored_checkout="apps/deskohub-workspace/e2e-artifacts/checkout"
          if [[ -e "$restored_checkout" || -e "$recovery_root" ]]; then
            echo "A restored source artifact or recovery backup already exists" >&2
            exit 1
          fi
          mkdir -p "$recovery_root/checkout/cleanup-journals" "$restored_checkout/cleanup-journals"
          for filename in run-context.json run-plan.json; do
            cp "$source_checkout/$filename" "$recovery_root/checkout/$filename"
            cp "$source_checkout/$filename" "$restored_checkout/$filename"
          done
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            filename="${path##*/}"
            cp "$path" "$recovery_root/checkout/cleanup-journals/$filename"
            cp "$path" "$restored_checkout/cleanup-journals/$filename"
          done < <(find "$case_dir" -mindepth 1 -maxdepth 1 -type f -print)
          for filename in run-context.json run-plan.json; do
            if [[ "$(sha256sum "$source_checkout/$filename" | cut -d ' ' -f1)" != "$(sha256sum "$restored_checkout/$filename" | cut -d ' ' -f1)" ]]; then
              echo "A restored source run identity file changed during staging" >&2
              exit 1
            fi
          done
          while IFS= read -r path; do
            [[ -n "$path" ]] || continue
            filename="${path##*/}"
            if [[ "$(sha256sum "$path" | cut -d ' ' -f1)" != "$(sha256sum "$restored_checkout/cleanup-journals/$filename" | cut -d ' ' -f1)" ]]; then
              echo "A restored source checkout journal changed during staging" >&2
              exit 1
            fi
          done < <(find "$case_dir" -mindepth 1 -maxdepth 1 -type f -print)
          echo "Validated and staged source run context, plan, account journal, and allowlisted checkout journals."

      - name: Resolve only the original Neon preview branch
        id: preview-database
        env:
          HEAD_REF: ${{ needs.resolve-target.outputs.head_ref }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$HEAD_REF" != "$EXPECTED_TARGET_REF" ]]; then
            echo "Resolved Neon branch is not the original failed run branch" >&2
            exit 1
          fi
          branch_name="preview/$HEAD_REF"
          branches="$(bunx neonctl@2.30.1 branches list \
            --project-id "$NEON_PROJECT_ID" \
            --api-key "$NEON_API_KEY" \
            --output json)"
          matches="$(jq --arg name "$branch_name" \
            '[(if type == "array" then . else .branches end)[] | select(.name == $name and .primary != true)]' \
            <<<"$branches")"
          if [[ "$(jq 'length' <<<"$matches")" != "1" ]]; then
            echo "The original failed-run Neon preview branch is missing or ambiguous" >&2
            exit 1
          fi
          branch_id="$(jq -r '.[0].id' <<<"$matches")"
          if [[ ! "$branch_id" =~ ^br-[A-Za-z0-9-]+$ ]]; then
            echo "The original Neon preview branch identity is invalid" >&2
            exit 1
          fi
          branch_id_sha256="$(printf '%s' "$branch_id" | sha256sum | cut -d ' ' -f1)"
          if [[ "$branch_id_sha256" != "$EXPECTED_NEON_BRANCH_ID_SHA256" ]]; then
            echo "The resolved Neon preview is not the original source-run branch" >&2
            exit 1
          fi
          direct_url="$(bunx neonctl@2.30.1 connection-string "$branch_id" \
            --project-id "$NEON_PROJECT_ID" --role-name neondb_owner \
            --database-name neondb --api-key "$NEON_API_KEY")"
          echo "::add-mask::$direct_url"
          pooled_url="$(bunx neonctl@2.30.1 connection-string "$branch_id" \
            --project-id "$NEON_PROJECT_ID" --role-name neondb_owner \
            --database-name neondb --pooled --api-key "$NEON_API_KEY")"
          echo "::add-mask::$pooled_url"
          {
            echo "branch_name=$branch_name"
            echo "direct_url=$direct_url"
            echo "pooled_url=$pooled_url"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved the unique original preview branch for cleanup-only recovery."

      - name: Run cleanup-only recovery against the restored source run
        id: recovery-cleanup
        working-directory: apps/deskohub-workspace
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          GITHUB_EVENT_NAME: workflow_dispatch
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          NEXI_API_ORIGIN: https://xpaysandbox.nexigroup.com/api/phoenix-0.0/psp
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
          DATABASE_URL: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_BASE_URL: ${{ needs.resolve-target.outputs.url }}
          WORKSPACE_E2E_DATABASE_URL_UNPOOLED: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_DATABASE_ALLOWLIST: ${{ steps.preview-database.outputs.direct_url }}
          WORKSPACE_E2E_PROVIDER_PERMIT_REQUIRED: "true"
          WORKSPACE_E2E_PROVIDER_PERMIT_DATABASE_URL: ${{ secrets.WORKSPACE_E2E_PROVIDER_PERMIT_DATABASE_URL }}
          WORKSPACE_E2E_PR_NUMBER: ${{ needs.resolve-target.outputs.pr_number }}
          WORKSPACE_E2E_POSTHOG_HOST: ${{ vars.WORKSPACE_E2E_POSTHOG_HOST }}
          WORKSPACE_E2E_POSTHOG_PROJECT_TOKEN: ${{ vars.WORKSPACE_E2E_POSTHOG_PROJECT_TOKEN }}
          DOTYPOS_API_URL: ${{ secrets.WORKSPACE_E2E_DOTYPOS_API_URL }}
          DOTYPOS_CLIENT_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_ID }}
          DOTYPOS_CLIENT_SECRET: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLIENT_SECRET }}
          DOTYPOS_REFRESH_TOKEN: ${{ secrets.WORKSPACE_E2E_DOTYPOS_REFRESH_TOKEN }}
          DOTYPOS_CLOUD_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_CLOUD_ID }}
          DOTYPOS_BRANCH_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_BRANCH_ID }}
          DOTYPOS_EMPLOYEE_ID: ${{ secrets.WORKSPACE_E2E_DOTYPOS_EMPLOYEE_ID }}
        run: |
          set -uo pipefail
          restored_context="e2e-artifacts/checkout/run-context.json"
          backup_context="$RUNNER_TEMP/workspace-e2e-recovery-validated-$EXPECTED_SOURCE_RUN_ID-$EXPECTED_SOURCE_RUN_ATTEMPT/checkout/run-context.json"
          restored_plan="e2e-artifacts/checkout/run-plan.json"
          backup_plan="$RUNNER_TEMP/workspace-e2e-recovery-validated-$EXPECTED_SOURCE_RUN_ID-$EXPECTED_SOURCE_RUN_ATTEMPT/checkout/run-plan.json"
          restored_account="e2e-artifacts/checkout/cleanup-journals/account-lane.json"
          backup_account="$RUNNER_TEMP/workspace-e2e-recovery-validated-$EXPECTED_SOURCE_RUN_ID-$EXPECTED_SOURCE_RUN_ATTEMPT/checkout/cleanup-journals/account-lane.json"
          if [[ ! -f "$restored_context" || ! -f "$restored_plan" || ! -f "$restored_account" ]]; then
            echo "The exact source run identity files were not restored" >&2
            exit 1
          fi
          restored_context_sha="$(sha256sum "$restored_context" | cut -d ' ' -f1)"
          backup_context_sha="$(sha256sum "$backup_context" | cut -d ' ' -f1)"
          restored_plan_sha="$(sha256sum "$restored_plan" | cut -d ' ' -f1)"
          backup_plan_sha="$(sha256sum "$backup_plan" | cut -d ' ' -f1)"
          if [[ "$restored_context_sha" != "$backup_context_sha" || "$restored_plan_sha" != "$backup_plan_sha" ]]; then
            echo "Restored source run identity changed before cleanup" >&2
            exit 1
          fi
          restored_account_ids="$(jq -c '[.authUserIds, .dotyposCustomerIds, .dotyposReservationIds]' "$restored_account")"
          backup_account_ids="$(jq -c '[.authUserIds, .dotyposCustomerIds, .dotyposReservationIds]' "$backup_account")"
          if [[ "$restored_account_ids" != "$backup_account_ids" ]]; then
            echo "Restored account journal candidates changed before cleanup" >&2
            exit 1
          fi
          output_dir="e2e-artifacts/checkout-recovery-output-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$output_dir" ]]; then
            echo "The cleanup-only output path already exists" >&2
            exit 1
          fi
          set +e
          bunx playwright test \
            --config playwright.e2e.config.ts \
            --project=checkout-cleanup \
            --no-deps \
            --output="$output_dir"
          cleanup_exit=$?
          set -e

          restored_context_sha="$(sha256sum "$restored_context" | cut -d ' ' -f1)"
          backup_context_sha="$(sha256sum "$backup_context" | cut -d ' ' -f1)"
          restored_plan_sha="$(sha256sum "$restored_plan" | cut -d ' ' -f1)"
          backup_plan_sha="$(sha256sum "$backup_plan" | cut -d ' ' -f1)"
          if [[ "$restored_context_sha" != "$backup_context_sha" || "$restored_plan_sha" != "$backup_plan_sha" ]]; then
            echo "Cleanup changed the restored source run context or plan" >&2
            exit 1
          fi
          restored_account_ids="$(jq -c '[.authUserIds, .dotyposCustomerIds, .dotyposReservationIds]' "$restored_account")"
          backup_account_ids="$(jq -c '[.authUserIds, .dotyposCustomerIds, .dotyposReservationIds]' "$backup_account")"
          if [[ "$restored_account_ids" != "$backup_account_ids" ]]; then
            echo "Cleanup changed the restored account journal candidate identities" >&2
            exit 1
          fi
          backup_journals="$RUNNER_TEMP/workspace-e2e-recovery-validated-$EXPECTED_SOURCE_RUN_ID-$EXPECTED_SOURCE_RUN_ATTEMPT/checkout/cleanup-journals"
          restored_journals="e2e-artifacts/checkout/cleanup-journals"
          backup_journal_count="$(find "$backup_journals" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          restored_journal_count="$(find "$restored_journals" -mindepth 1 -maxdepth 1 -type f | wc -l | tr -d ' ')"
          if [[ "$backup_journal_count" != "$restored_journal_count" ]]; then
            echo "Cleanup changed the restored checkout journal set" >&2
            exit 1
          fi
          while IFS= read -r original_journal; do
            [[ -n "$original_journal" ]] || continue
            filename="${original_journal##*/}"
            if [[ "$filename" == "account-lane.json" ]]; then
              continue
            fi
            if [[ ! -f "$restored_journals/$filename" ||
                  "$(sha256sum "$original_journal" | cut -d ' ' -f1)" != "$(sha256sum "$restored_journals/$filename" | cut -d ' ' -f1)" ]]; then
              echo "Cleanup changed a restored source checkout journal" >&2
              exit 1
            fi
          done < <(find "$backup_journals" -mindepth 1 -maxdepth 1 -type f -print)
          if [[ "$cleanup_exit" == "0" ]]; then
            if ! jq -e --slurpfile original "$backup_account" \
              '.completed == true and
               .authUserIds == $original[0].authUserIds and
               .dotyposCustomerIds == $original[0].dotyposCustomerIds and
               .dotyposReservationIds == $original[0].dotyposReservationIds' \
              "$restored_account" >/dev/null; then
              echo "Cleanup did not preserve and complete the source account journal" >&2
              exit 1
            fi
            echo "Cleanup-only project passed for source run $EXPECTED_SOURCE_RUN_ID attempt $EXPECTED_SOURCE_RUN_ATTEMPT using runtime target $RUNTIME_TARGET_SHA."
            echo "recovery_outcome=success" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Cleanup-only project failed for source run $EXPECTED_SOURCE_RUN_ID attempt $EXPECTED_SOURCE_RUN_ATTEMPT; the source run remains failed." >&2
          echo "recovery_outcome=failure" >> "$GITHUB_OUTPUT"
          exit "$cleanup_exit"

  publish-final-status:
    needs: [resolve-target, test-e2e]
    if: always() && inputs.recover_failed_e2e_run != true && needs.resolve-target.outputs.eligible == 'true' && needs.resolve-target.outputs.skipped != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish final commit status
        if: always()
        env:
          ALLOCATION_SHARD: ${{ needs.test-e2e.outputs.shard }}
          ALLOCATION_DESCRIPTION: ${{ needs.test-e2e.outputs.shard == '' && 'Workspace E2E shard allocation failed' || needs.test-e2e.outputs.release_outcome == 'success' && 'Workspace E2E shard released' || 'Workspace E2E shard release failed' }}
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ needs.test-e2e.result == 'success' && 'success' || 'failure' }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
        run: |
          if [[ "$STATUS_STATE" == "success" ]]; then
            description='Protected preview E2E passed'
          else
            description='Protected preview E2E failed'
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$STATUS_STATE" \
            -f context='Workspace E2E' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$STATUS_STATE" \
            -f context='Workspace E2E allocation' \
            -f description="$ALLOCATION_DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null

  publish-skipped-status:
    needs: resolve-target
    if: inputs.recover_failed_e2e_run != true && needs.resolve-target.outputs.eligible == 'true' && needs.resolve-target.outputs.skipped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Publish status for unchanged Workspace
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_DESCRIPTION: ${{ needs.resolve-target.outputs.skipped_status_description }}
          STATUS_STATE: ${{ needs.resolve-target.outputs.skipped_status_state }}
          TARGET_SHA: ${{ needs.resolve-target.outputs.sha }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/statuses/$TARGET_SHA" \
            -f state="$STATUS_STATE" \
            -f context='Workspace E2E' \
            -f description="$STATUS_DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            >/dev/null
