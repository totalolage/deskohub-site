name: DHW CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/dhw-ci.yml
      - apps/dhw/**
      - apps/deskohub-workspace/app/api/v1/cli/**
      - apps/deskohub-workspace/features/admin-cli/**
      - apps/deskohub-workspace/shared/backend/workspace-http-api-route.ts
      - packages/workspace-admin-api/**
      - bun.lock
      - package.json
      - release-please-config.json
      - .release-please-manifest.json

concurrency:
  group: dhw-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-release-intent:
    if: >-
      github.event.action != 'converted_to_draft' &&
      !startsWith(github.head_ref, 'release-please--branches--main--components--dhw')
    runs-on: ubuntu-latest

    steps:
      - name: Require a releasable CLI commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          changed_files="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename')"

          if ! grep -Eq '^(apps/dhw/|packages/workspace-admin-api/)' <<<"$changed_files"; then
            echo "No releasable dhw files changed."
            exit 0
          fi

          if grep -Eq '^packages/workspace-admin-api/' <<<"$changed_files" &&
            ! grep -Eq '^apps/dhw/' <<<"$changed_files"; then
            echo "A shared CLI contract change must also update apps/dhw so Release Please attributes it to dhw." >&2
            exit 1
          fi

          commit_messages="$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].commit.message')"

          if ! grep -Eq '^(feat|fix)(\(dhw\))?!?: ' <<<"$commit_messages"; then
            echo "A PR changing dhw must include a releasable Conventional Commit." >&2
            echo "Use feat(dhw): or fix(dhw): (with ! for a breaking change)." >&2
            exit 1
          fi

  test:
    if: github.event.action != 'converted_to_draft'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Lint the CLI contract and implementation
        run: >-
          bun turbo lint
          --filter=@deskohub/workspace-admin-api
          --filter=dhw

      - name: Typecheck the CLI contract and implementation
        run: >-
          bun turbo typecheck
          --filter=@deskohub/workspace-admin-api
          --filter=dhw

      - name: Test the CLI and Workspace API adapter
        run: |
          bun --cwd apps/dhw test
          bun --cwd apps/deskohub-workspace test \
            features/admin-cli/workspace-admin-api.server.test.ts \
            'app/api/v1/cli/[...path]/route.test.ts'

      - name: Build and smoke-test a development binary
        run: |
          set -euo pipefail

          bun apps/dhw/src/build.ts development
          expected_version="$(jq -r '.version' apps/dhw/package.json)+development"
          build_info="$(apps/dhw/dist/dhw version --json)"
          test "$(jq -r '.version' <<<"$build_info")" = "$expected_version"
          test "$(jq -r '.target' <<<"$build_info")" = "development"

  build-pr-binaries:
    if: >-
      github.event.action != 'converted_to_draft' &&
      github.event.pull_request.draft == false
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64-baseline
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Describe the PR build
        id: build
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "short_sha=${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "version_tag=pr.${PR_NUMBER}.${HEAD_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Compile the native PR binary
        env:
          DHW_BUILD_VERSION_TAG: ${{ steps.build.outputs.version_tag }}
          DHW_TARGET: ${{ matrix.target }}
        run: bun apps/dhw/src/build.ts "$DHW_TARGET"

      - name: Verify and package the PR binary
        env:
          DHW_BUILD_VERSION_TAG: ${{ steps.build.outputs.version_tag }}
          DHW_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          binary="apps/dhw/dist/dhw-${DHW_TARGET}"
          test -x "$binary"
          expected_version="$(jq -r '.version' apps/dhw/package.json)+${DHW_BUILD_VERSION_TAG}"
          build_info="$("$binary" version --json)"
          test "$(jq -r '.version' <<<"$build_info")" = "$expected_version"
          test "$(jq -r '.target' <<<"$build_info")" = "$DHW_TARGET"

          (
            cd apps/dhw/dist
            shasum -a 256 "dhw-${DHW_TARGET}" > "dhw-${DHW_TARGET}.sha256"
            tar -czf "dhw-${DHW_TARGET}.tar.gz" \
              "dhw-${DHW_TARGET}" \
              "dhw-${DHW_TARGET}.sha256"
            shasum -a 256 "dhw-${DHW_TARGET}.tar.gz" \
              > "dhw-${DHW_TARGET}.tar.gz.sha256"
          )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dhw-pr-${{ github.event.pull_request.number }}-${{ steps.build.outputs.short_sha }}-${{ matrix.target }}
          path: |
            apps/dhw/dist/dhw-${{ matrix.target }}.tar.gz
            apps/dhw/dist/dhw-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
