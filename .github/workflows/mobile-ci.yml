name: Mobile CI

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/mobile-ci.yml
      - apps/deskohub-mobile/**
      - packages/brand-tokens/**
      - packages/i18n/**
      - packages/reservation/**
      - packages/standard-schema/**
      - bun.lock
      - package.json
      - turbo.json
      - biome.json
      - tsconfig.json
      - lint/**
      - patches/**
  push:
    branches: [main]
    paths:
      - .github/workflows/mobile-ci.yml
      - apps/deskohub-mobile/**
      - packages/brand-tokens/**
      - packages/i18n/**
      - packages/reservation/**
      - packages/standard-schema/**
      - bun.lock
      - package.json
      - turbo.json
      - biome.json
      - tsconfig.json
      - lint/**
      - patches/**

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event.action != 'converted_to_draft'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Lint, typecheck, test, and export the mobile web build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: bun turbo lint typecheck test build:web --filter=deskohub-mobile
