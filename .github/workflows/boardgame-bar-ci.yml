name: Boardgame Bar CI

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - .github/workflows/boardgame-bar-ci.yml
      - apps/deskohub-boardgame-bar/**
      - packages/**
      - bun.lock
      - package.json
      - turbo.json

concurrency:
  group: boardgame-bar-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.action != 'converted_to_draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      - name: Run Boardgame Bar tests
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
        run: bun turbo test --filter=deskohub-boardgame-bar
