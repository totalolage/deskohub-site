name: Workspace CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: workspace-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-workspace-migrations:
    if: github.event.action != 'converted_to_draft'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate Workspace migration count
        working-directory: apps/deskohub-workspace
        run: bun scripts/validate-migration-count.ts "${{ github.event.pull_request.base.sha }}"

  test-functional:
    if: github.event.action != 'converted_to_draft'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workspace_account_tests
          POSTGRES_PASSWORD: workspace_test_password
          POSTGRES_USER: workspace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workspace_test -d workspace_account_tests"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Apply account link migration
        working-directory: apps/deskohub-workspace
        env:
          DATABASE_URL: postgres://workspace_test:workspace_test_password@localhost:5432/workspace_account_tests
        run: |
          bun -e '
            import { Client } from "pg";
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            try {
              const migration = await Bun.file("db/migrations/20260815103004_stormy_wilson_fisk/migration.sql").text();
              await client.query(migration);
            } finally {
              await client.end();
            }
          '

      - name: Test account repository concurrency
        working-directory: apps/deskohub-workspace
        env:
          DATABASE_URL: postgres://workspace_test:workspace_test_password@localhost:5432/workspace_account_tests
          WORKSPACE_ACCOUNT_DATABASE_TESTS: "true"
        run: |
          bun run i18n:compile
          bun test --preload ./shared/testing/workspace-test-env.ts --parallel=1 \
            features/account/backend/customer-account-link.repository.database.test.ts

      - name: Validate Workspace E2E allocation bundle
        run: |
          bun --cwd apps/deskohub-workspace e2e:coordination:build-action
          git diff --exit-code -- \
            .github/actions/workspace-e2e-allocation/index.mjs

      - run: bun turbo typecheck

      - run: bun turbo test --filter=./apps/deskohub-workspace
