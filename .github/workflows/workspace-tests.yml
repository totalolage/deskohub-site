name: Workspace CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]

concurrency:
  group: workspace-ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-workspace-migrations:
    if: github.event.action != 'converted_to_draft'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate Workspace migration count
        working-directory: apps/deskohub-workspace
        run: bun scripts/validate-migration-count.ts "${{ github.event.pull_request.base.sha }}"

  test-functional:
    if: github.event.action != 'converted_to_draft'
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
      WORKSPACE_REAL_POSTGRES_TEST_URL: postgresql://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Start disposable PostgreSQL 18.4 with pg_uuidv7 1.7.0
        run: |
          docker build \
            --file .github/fixtures/workspace-postgres/Dockerfile \
            --tag deskohub-workspace-postgres:18.4-pg_uuidv7-1.7.0 \
            .github/fixtures/workspace-postgres
          docker run --detach --rm --name deskohub-workspace-postgres \
            --env POSTGRES_HOST_AUTH_METHOD=trust \
            --publish 5432:5432 \
            deskohub-workspace-postgres:18.4-pg_uuidv7-1.7.0
          for attempt in {1..30}; do
            docker exec deskohub-workspace-postgres pg_isready -U postgres && break
            sleep 1
          done
          docker exec deskohub-workspace-postgres psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF current_setting('server_version') <> '18.4' THEN
              RAISE EXCEPTION 'Expected PostgreSQL 18.4, got %', current_setting('server_version');
            END IF;
          END
          $$;
          CREATE EXTENSION pg_uuidv7;
          DO $$
          BEGIN
            IF (SELECT extversion FROM pg_extension WHERE extname = 'pg_uuidv7') <> '1.7' THEN
              RAISE EXCEPTION 'Expected pg_uuidv7 1.7, got %', (SELECT extversion FROM pg_extension WHERE extname = 'pg_uuidv7');
            END IF;
            PERFORM uuid_generate_v7();
          END
          $$;
          SQL

      - run: bun turbo typecheck

      - run: bun turbo test --filter=./apps/deskohub-workspace

      - name: Stop disposable PostgreSQL
        if: always()
        run: docker rm --force deskohub-workspace-postgres || true
